<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Formato IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #output {
            font-family: 'Times New Roman', Times, serif;
            color: black;
        }
        #output p {
            word-break: break-word;
            text-align: justify;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">Asistente de Formato IA</h1>
            <p class="text-md sm:text-lg text-gray-600 mt-2">Pega tu texto, describe el formato deseado y descarga el resultado como .docx.</p>
        </header>

        <main class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
            
            <div class="text-center mb-6">
                <button id="load-example-button" class="bg-gray-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-300 transition-transform transform hover:scale-105 duration-300 ease-in-out">
                    Cargar Ejemplo del Supuesto 58
                </button>
            </div>

            <!-- Área de Texto Original -->
            <div class="mb-6">
                <label for="raw-text" class="block text-lg font-semibold mb-2 text-gray-700">1. Tu Texto</label>
                <textarea id="raw-text" rows="12" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200" placeholder="Escribe o pega tu texto aquí..."></textarea>
            </div>

            <!-- Campo de Instrucciones -->
            <div class="mb-6">
                <label for="instructions" class="block text-lg font-semibold mb-2 text-gray-700">2. Instrucciones de Formato</label>
                <textarea id="instructions" rows="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200" placeholder="Describe el formato que quieres..."></textarea>
            </div>

            <!-- Botón de Acción Principal -->
            <div class="text-center mb-6">
                <button id="format-button" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-transform transform hover:scale-105 duration-300 ease-in-out flex items-center justify-center mx-auto space-x-2">
                    <span class="button-text">Aplicar Formato</span>
                    <div class="loader hidden"></div>
                </button>
            </div>
            
            <!-- Mensaje de Error -->
            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative my-4" role="alert">
                <strong class="font-bold">¡Error!</strong>
                <span class="block sm:inline" id="error-text"></span>
            </div>

            <!-- Área de Resultado -->
            <div class="mb-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">3. Previsualización</h2>
                <div id="output" class="w-full p-6 border border-gray-200 rounded-lg bg-white min-h-[200px] shadow-inner">
                    <p class="text-gray-400 font-sans">Aquí aparecerá tu texto formateado...</p>
                </div>
            </div>

            <!-- Botón de Descarga -->
            <div class="text-center">
                <button id="download-button" class="bg-green-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 transition-transform transform hover:scale-105 duration-300 ease-in-out hidden">
                    <svg class="inline-block w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Descargar .docx
                </button>
            </div>

        </main>
        
        <footer class="text-center mt-8 text-gray-500 text-sm">
            <p>Potenciado con la API de Gemini y html-docx-js.</p>
        </footer>
    </div>

    <script>
        // --- REFERENCIAS AL DOM ---
        const rawTextInput = document.getElementById('raw-text');
        const instructionsInput = document.getElementById('instructions');
        const formatButton = document.getElementById('format-button');
        const downloadButton = document.getElementById('download-button');
        const outputDiv = document.getElementById('output');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const loadExampleButton = document.getElementById('load-example-button');

        // --- DATOS DEL EJEMPLO ---
        const exampleText = `SUPUESTO 58
La gestión directa
SUPUESTO
El servicio de recaudación de los tributos municipales se está desarrollando en la actualidad a través de un contrato de servicios. Sin embargo, el Ayuntamiento se está planteando no externalizar el servicio de manera que pretende gestionarlo él mismo.
Se trataría de gestionar el servicio por parte del propio Ayuntamiento sin particular alguno interpuesto, bien a través de la propia entidad, a través de su propia organización centralizada, o, de forma descentralizada, de un organismo autónomo, de una entidad pública empresarial o de una sociedad mercantil de capital íntegramente perteneciente al ente local cuyo objeto social estaría destinado a la prestación del servicio de recaudación de los tributos municipales.
PREGUNTAS
1. Analizar la gestión directa de los servicios públicos de las Entidades Locales y su incidencia en aquellas actuaciones que impliquen ejercicio de autoridad.
2. ¿Qué es un Organismo Autónomo?. ¿Sería esta modalidad de gestión directa la forma más adecuada de prestar este servicio?
3. Si el régimen del personal en un organismo autónomo puede estar sometido al Derecho Laboral, ¿cómo puede compaginarse su régimen jurídico con las funciones que se prestan en materia de recaudación?
4. ¿Si se crease una sociedad mixta para gestionar algún servicio municipal, ¿considera Vd. que el Ayuntamiento podría tener competencia respecto a la gestión del servicio que sea prestada por aquella?
5. ¿Qué es lo que declara la Ley 57/2003 en cuanto a las sociedades mercantiles de capital íntegramente municipal?
RESPUESTAS
Pregunta 1
El artículo 85 de la LBRL, en su redacción originaria, establecía que son servicios públicos locales cuantos tiendan a la consecución de los fines señalados como de la competencia de las Entidades locales. Distinguiendo, como forma prestataria de dichos servicios públicos locales, los modos de gestión directa e indirecta. Haciéndose la advertencia de que en ningún caso podrán prestarse por gestión indirecta los servicios públicos que implicasen ejercicio de autoridad.`;

        const exampleInstructions = `Formatea el texto usando HTML y estilos en línea (inline CSS) para replicar fielmente los siguientes estilos de Word. Usa la fuente 'Times New Roman' para todo el documento.

**DEFINICIÓN DE ESTILOS:**
1.  **Estilo 'Normal':** Alineación justificada (usa 'text-align: justify; word-break: break-word;'). Sangría de primera línea de 0.63cm (usa 'text-indent: 0.63cm;'). Espaciado de 6pt antes y después del párrafo (usa 'margin-top: 6pt; margin-bottom: 6pt;').
2.  **Estilo 'TÍTULO #1':** Basado en 'Normal', pero con alineación centrada, todo en mayúsculas y en negrita.
3.  **Estilo 'Título #2':** Basado en 'Normal', pero con alineación centrada y en cursiva.
4.  **Estilo 'TÍTULO #3':** Basado en 'Normal', pero todo en mayúsculas y en negrita.
5.  **Estilo 'Título #4':** Basado en 'Normal', pero en negrita.
6.  **Estilo 'List. Preguntas':** Debe ser una lista ordenada (<ol>). Cada elemento (<li>) debe tener una sangría francesa de 0.63cm. Esto se logra con 'padding-left: 0.63cm;' y 'text-indent: -0.63cm;'.

**APLICACIÓN DE ESTILOS AL TEXTO:**
-   Aplica 'TÍTULO #1' a "SUPUESTO 58" y a "RESPUESTAS".
-   Aplica 'Título #2' a "La gestión directa".
-   Aplica 'TÍTULO #3' a "SUPUESTO" y a "PREGUNTAS".
-   Aplica 'Título #4' a "Pregunta 1".
-   Aplica 'List. Preguntas' a la lista numerada que empieza con "1. Analizar...".
-   Aplica 'Normal' a todos los demás párrafos.

Genera únicamente el código HTML resultante, sin explicaciones adicionales.`;

        // --- MANEJADORES DE EVENTOS ---
        
        loadExampleButton.addEventListener('click', () => {
            rawTextInput.value = exampleText;
            instructionsInput.value = exampleInstructions;
            alert('Ejemplo del "Supuesto 58" cargado.');
        });
        
        formatButton.addEventListener('click', async () => {
            const rawText = rawTextInput.value.trim();
            const instructions = instructionsInput.value.trim();
            if (!rawText || !instructions) {
                showError('Por favor, introduce texto e instrucciones de formato.');
                return;
            }

            const buttonText = formatButton.querySelector('.button-text');
            const loader = formatButton.querySelector('.loader');

            buttonText.classList.add('hidden');
            loader.classList.remove('hidden');
            formatButton.disabled = true;
            errorMessage.classList.add('hidden');
            outputDiv.innerHTML = '<p class="text-gray-400 font-sans">Generando previsualización...</p>';

            try {
                const prompt = `Basado en el siguiente texto y las instrucciones, formatea el texto exclusivamente con etiquetas HTML y estilos en línea (inline CSS) para replicar los formatos indicados. No añadas explicaciones, solo el código HTML resultante.\n\nINSTRUCCIONES:\n${instructions}\n\nTEXTO:\n${rawText}`;
                
                let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
                const payload = { contents: chatHistory };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errorDetail = `HTTP ${response.status}: ${response.statusText}`;
                    try {
                        const errorResponse = await response.json();
                        if (errorResponse.error && errorResponse.error.message) {
                            errorDetail = errorResponse.error.message;
                        }
                    } catch (e) { /* Ignorar error de parseo */ }
                    throw new Error(`Error en la API: ${errorDetail}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0]) {
                    let formattedHtml = result.candidates[0].content.parts[0].text;
                    outputDiv.innerHTML = formattedHtml.replace(/^```html\n?/, '').replace(/\n?```$/, '');
                    downloadButton.classList.remove('hidden');
                } else {
                    if (result.promptFeedback && result.promptFeedback.blockReason) {
                         throw new Error(`La solicitud fue bloqueada por la IA. Razón: ${result.promptFeedback.blockReason}`);
                    }
                    throw new Error('La respuesta de la IA no tuvo el formato esperado o estaba vacía.');
                }
            } catch (error) {
                console.error('Error durante el formateo:', error);
                showError(error.message);
                outputDiv.innerHTML = '<p class="text-red-500 font-sans">Ocurrió un error al formatear el texto.</p>';
            } finally {
                buttonText.classList.remove('hidden');
                loader.classList.add('hidden');
                formatButton.disabled = false;
            }
        });
        
        downloadButton.addEventListener('click', () => {
            const content = outputDiv.innerHTML;
            const fullHtml = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Documento Formateado</title><style>body { font-family: 'Times New Roman', Times, serif; font-size: 12pt; } p { margin: 0; text-align: justify; word-break: break-word; }</style></head><body>${content}</body></html>`;
            const converted = htmlDocx.asBlob(fullHtml);
            saveAs(converted, 'documento_formateado.docx');
        });

        // --- FUNCIÓN DE ERROR ---
        function showError(message) {
            let userFriendlyMessage = message;
            if (message.includes('401')) {
                userFriendlyMessage = "Error de autenticación (401). Esto suele ser un problema temporal con la clave de API del entorno. Por favor, inténtalo de nuevo en unos momentos.";
            }
            errorText.textContent = userFriendlyMessage;
            errorMessage.classList.remove('hidden');
        }

    </script>
</body>
</html>
